services:
  valfacade-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_WEATHER_API_KEY=${VITE_WEATHER_API_KEY}
    container_name: valfacade-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - valfacade-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # ---- Security hardening ----
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /etc/nginx/conf.d:noexec,nosuid,size=1m

    # Resource limits (anti-DoS)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
          pids: 100
        reservations:
          cpus: '0.25'
          memory: 64M

    # Logging limits
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  valfacade-network:
    driver: bridge
